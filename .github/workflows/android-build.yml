
name: Build ClickFix Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ClickFix for Android ARM64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64
          build-config: Release

      - name: Upload Geode package
        uses: actions/upload-artifact@v4
        with:
          name: ClickFix-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          
